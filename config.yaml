# =============================================================================
#  CryptoBot — personal signal-trading bot for CoinDCX (India) — CONFIG
#  Edit freely. Everything below is tunable; the bot checks the market every
#  hour but trades ONLY when a condition is met.
# =============================================================================

mode: paper                # paper (default, no API key needed) | live (needs keys below)

# --- Paper account -----------------------------------------------------------
initial_cash_inr: 50000    # starting paper cash (INR)
fee_rate: 0.001            # exchange taker fee per trade, fraction (0.001 = 0.10%)
slippage_bps: 5            # simulated slippage in basis points (5 bps = 0.05%)
simulate_tds: true         # simulate the 1% TDS that Indian exchanges deduct on sells
tds_rate: 0.01             # 1% TDS under Section 194S

check_interval_min: 60     # in `run` mode, how often to re-check (minutes)

# Throttle public CoinDCX requests when scanning many markets. 0 disables it;
# 0.15 means at most roughly 7 requests/second.
public_request_interval_sec: 0.15

# --- Assets (INR spot pairs on CoinDCX) --------------------------------------
# Use "auto" to discover every active INR spot market from CoinDCX at startup.
# To return to the original small watchlist, replace "auto" with:
#   - name: BTCINR
#     pair: I-BTC_INR
#   - name: ETHINR
#     pair: I-ETH_INR
#   - name: SOLINR
#     pair: I-SOL_INR
assets: auto

asset_discovery:
  enabled: false           # also set true to force discovery even if assets is a list
  min_volume_inr: 0        # skip tiny/illiquid pairs, e.g. 100000 for ₹1L 24h turnover
  max_assets: null         # null/0 = all discovered assets; e.g. 50 for top by turnover

# --- Strategy: "RSI Swing" (condition-based, hourly) --------------------------
# The bot checks hourly. It acts ONLY when a condition is met:
#   BUY  : 1h RSI <= entry_rsi   (oversold dip)   and no open position
#   SELL : take-profit  >= avg cost x (1 + take_profit_pct/100)   -> close +X%
#          stop-loss    <= avg cost x (1 - stop_loss_pct/100)     -> cut -Y%
#          overbought   1h RSI >= exit_rsi                        -> close early
# One position per asset at a time — no stacking, no panic-doubling.
strategy:
  timeframe: 1h            # candle size used for signals
  rsi_period: 14           # RSI lookback
  entry_rsi: 30            # buy when hourly RSI is at/below this (oversold)
  exit_rsi: 72             # sell when hourly RSI reaches this (overbought)
  take_profit_pct: 4       # sell when price >= avg cost + 4%
  stop_loss_pct: 2         # sell when price <= avg cost - 2%
  position_size_pct: 40    # % of available paper cash deployed per buy
  min_buy_inr: 500         # skip buys smaller than this (exchange min notional ₹100)
  signal_lookback: 200     # hourly candles fetched per asset per check

# --- Backtest ----------------------------------------------------------------
backtest:
  days: 30                 # how much 1h history to replay
  start_cash_inr: 100000   # starting cash for the strategy AND the hold benchmark
  fee_rate: 0.001
  slippage_bps: 5
  tds_rate: 0.01

# --- 100–200 account tournament (`bot.py sweep` / `sweep-live`) ---------------
# Demo accounts are generated by mixing the candidate values below (deterministic,
# spread over the whole grid). Every account gets a UNIQUE strategy, and every
# account starts with `start_cash_inr` (₹10,000). Account acc_001 is always the
# baseline from the `strategy:` section above. All accounts trade the same
# assets — only the strategy parameters differ.
sweep:
  accounts: 200             # how many demo accounts (configurable, e.g. 100–500)
  start_cash_inr: 10000     # starting paper balance for EACH demo account
  days: 30                  # history replayed in the `sweep` tournament
  entry_rsi: [22, 25, 28, 30, 33, 36, 40]
  exit_rsi: [64, 68, 72, 76, 80]
  take_profit_pct: [3, 4, 5, 6, 8, 10, 12]
  stop_loss_pct: [1, 1.5, 2, 3]
  position_size_pct: [20, 30, 40, 50, 60]

# --- Live trading (OPT-IN. Read README "Going live" first) -------------------
live:
  enabled: false
  api_key_env: COINDCX_API_KEY      # set these as environment variables
  api_secret_env: COINDCX_API_SECRET
