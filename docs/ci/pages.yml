# Drop-in: publish ONLY the dashboard to GitHub Pages.
#
# WHY: the repo currently ships TWO competing Pages workflows —
# `.github/workflows/static.yml` and `.github/workflows/jekyll-gh-pages.yml`.
# Both trigger on every push to main, both use concurrency group "pages", and
# both upload the ENTIRE repository (`path: '.'`). That means:
#
#   1. Two deployments race each other on every push — whichever finishes last
#      wins, so the site you see is nondeterministic, and the minutes are billed
#      twice.
#   2. The whole repo is published as a public website: src/, config/config.yaml,
#      data/ (including web/state/portfolio.json), .github/ and .git metadata.
#      Source and configuration were never meant to be served.
#   3. The Jekyll build is pointless here — the dashboard is plain static HTML
#      with no Jekyll config, and Jekyll also skips dotfiles and can mangle
#      paths.
#
# FIX: use this single workflow, which uploads `web/` only, and delete the two
# legacy ones.
#
# APPLY (needs `workflows` permission — the sandbox App token does not have it):
#
#   git rm .github/workflows/static.yml
#   git rm .github/workflows/jekyll-gh-pages.yml
#   cp docs/ci/pages.yml .github/workflows/pages.yml
#   git add .github/workflows/pages.yml && git commit -m "ci: publish web/ only"
#
# Then: repo -> Settings -> Pages -> Source -> "GitHub Actions".

name: Deploy dashboard to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; never cancel an in-flight one.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # web/ is the dashboard: index.html + the other pages, styles.css,
          # app.js and the generated data.js. Nothing else needs to be public.
          path: 'web/'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
