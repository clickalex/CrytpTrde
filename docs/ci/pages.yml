# Drop-in: publish ONLY the dashboard to GitHub Pages, and keep it fresh.
#
# HISTORY
#   v1 (superseded): Pages was "Deploy from a branch -> main / /docs", so the
#   site served docs/ (CI notes) instead of web/ (the dashboard). Fixed by
#   switching Pages source to "GitHub Actions" and adding this workflow with
#   `on: push` — that part is done and confirmed working (build_type=workflow
#   per `gh api repos/OWNER/REPO/pages`).
#
#   v2 (this version) — THE ACTUAL BUG THIS TICKET IS ABOUT:
#   Even after v1, the LIVE site kept showing data up to ~35 hours stale,
#   while data/*.csv and web/data.js *in the repo* were completely current —
#   every hourly run really was updating the numbers, just not the published
#   site. Root cause:
#
#     The hourly bot workflow (dca.yml, and the four cloud-control command
#     workflows below) commits the fresh CSVs + a regenerated web/data.js and
#     pushes with the Actions-provided default GITHUB_TOKEN. GitHub
#     explicitly does NOT let commits/pushes made with that token trigger
#     *other* `on: push` workflows — an intentional anti-recursion guard, not
#     a bug in this repo:
#       https://docs.github.com/en/actions/using-workflows/triggering-a-workflow#triggering-a-workflow-from-a-workflow
#     So every hourly run updated the repo perfectly, but never re-ran
#     "Deploy dashboard to Pages" — the live site only advanced on the rare
#     push a human made directly (opening/merging a PR), not on the bot's own
#     commits.
#
#   Fix (two layers, both exempt from the GITHUB_TOKEN guard):
#     1. `workflow_run`: redeploy the instant one of the data-changing
#        workflows finishes successfully — near-real-time updates.
#     2. `schedule` (cron, 15 min after the bot's own hourly `:30` run):
#        a safety net that redeploys every hour NO MATTER what triggered the
#        bot (schedule, manual dispatch, a future workflow not yet in the
#        `workflow_run.workflows` list, etc.) — this is what actually
#        guarantees the site can never again lag by more than ~1 run.
#
# APPLYING THIS DROP-IN (needs `workflows` permission the sandbox App token
# lacks — apply via the GitHub web UI, or from a machine/PAT that has it):
#
#   cp docs/ci/pages.yml .github/workflows/pages.yml
#   git add .github/workflows/pages.yml
#   git commit -m "ci: redeploy Pages after every bot run (workflow_run + hourly schedule)"
#   git push
#
# Pages source must already be "GitHub Actions" (Settings -> Pages -> Source)
# — it already is, confirmed via the Pages API.

name: Deploy dashboard to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  # Layer 1 — near-instant: redeploy as soon as one of these finishes. They
  # all commit fresh data with the default GITHUB_TOKEN, which (per GitHub's
  # anti-recursion design) cannot trigger `on: push`, so we listen for
  # `workflow_run` instead (that path IS exempt from the guard).
  workflow_run:
    workflows:
      - "Crypto Bot"
      - "Trading Commands"
      - "Analysis Commands"
      - "Tournament Commands"
      - "Maintenance Commands"
    types:
      - completed
  # Layer 2 — safety net: the hourly bot runs at :30 UTC (dca.yml). Redeploy
  # 15 minutes later regardless of what triggered it or whether workflow_run
  # fired, so a renamed/forgotten workflow can never leave Pages stale again.
  schedule:
    - cron: "45 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; never cancel an in-flight one.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    # workflow_run fires even when the triggering run failed or was
    # cancelled; only redeploy Pages when it actually succeeded (ordinary
    # push / workflow_dispatch / schedule triggers have no conclusion field
    # and always pass this check).
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # workflow_run/schedule don't automatically check out the commit
          # that triggered them; pin explicitly to main so the deployed
          # dashboard always matches the latest bot commit there.
          ref: main

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # web/ is the dashboard: index.html + the other pages, styles.css,
          # app.js and the generated data.js. Nothing else needs to be public.
          path: 'web/'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
