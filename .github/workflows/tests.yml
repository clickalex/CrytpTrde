name: Tests

# Runs the offline test suite (tests/test_speed_fix.py - stubbed CoinDCX, no
# network) on every push and pull request, so a regression - e.g. a broken
# exit rule or a crashed simulator - is caught before it reaches main.
# The hourly bot workflow (dca.yml) is separate and unaffected.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run offline test suite (15 tests)
        run: python3 tests/test_speed_fix.py
